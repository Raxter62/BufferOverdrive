<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUFFER OVERDRIVE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main id="game-container">
        <section class="arcade-stage-shell" id="arcadeStageShell">
            <div class="arcade-stage" id="arcadeStage">
                <div class="screen-wrap">
                    <canvas id="gameCanvas" width="640" height="480" aria-label="BUFFER OVERDRIVE game screen"></canvas>
                    <div class="game-over hidden" id="gameOverPanel">
                        <p class="eyebrow">SYSTEM OVERLOAD</p>
                        <h2>Buffer 過載</h2>
                        <p id="finalStats">分數 0，處理 0 筆資料。</p>
                        <button id="restartButton" type="button">重新開始</button>
                    </div>
                </div>

                <aside class="hud-panel">
                    <div class="scoreboard-panel" aria-label="記分板">
                        <div class="scoreboard-head">
                            <span>SCORE</span>
                            <strong id="scoreValue">0</strong>
                        </div>
                        <div class="scoreboard-foot">
                            <span class="scoreboard-star" aria-hidden="true">★</span>
                            <span class="scoreboard-best-label">BEST</span>
                            <strong id="bestScoreValue">0 PTS</strong>
                        </div>
                    </div>

                    <div class="leaderboard-panel" aria-label="排行榜">
                        <h3>排行榜</h3>
                        <ol class="leaderboard-list" id="leaderboardList"></ol>
                    </div>

                    <div class="quick-stats">
                        <div>
                            <span>處理</span>
                            <strong id="handledValue">0</strong>
                        </div>
                        <div>
                            <span>吸收</span>
                            <strong id="absorbValue">0</strong>
                        </div>
                        <div>
                            <span>丟棄</span>
                            <strong id="discardValue">0</strong>
                        </div>
                    </div>

                    <div class="packet-panel">
                        <span>待處理資料</span>
                        <strong id="packetName">等待中</strong>
                        <p id="packetMeta">接住資料後有 1.5 秒可以決策，J 吸收，K 丟棄。</p>
                        <div class="decision-bar">
                            <div id="decisionFill"></div>
                        </div>
                    </div>
                </aside>

                <div class="arcade-controls-layer" aria-hidden="true">
                    <div class="arcade-control-sprite" id="arcadeStick"></div>
                    <div class="arcade-control-sprite" id="arcadeButtonA"></div>
                    <div class="arcade-control-sprite" id="arcadeButtonB"></div>
                    <div class="arcade-control-sprite" id="arcadeButtonC"></div>
                    <div class="arcade-control-sprite" id="arcadeButtonD"></div>
                </div>

                <img class="arcade-overlay" src="{{ url_for('static', filename='player_image/background/arcade.png') }}"
                    alt="" aria-hidden="true">
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/player.js') }}"></script>
    <script src="{{ url_for('static', filename='js/gameplay.js') }}"></script>
    <script src="{{ url_for('static', filename='js/boss.js') }}"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
    <script src="{{ url_for('static', filename='js/render.js') }}"></script>
</body>

</html>
